<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="polaroidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0"/>
    </radialGradient>
    <filter id="photoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="48" fill="url(#polaroidGlow)"/>

  <g filter="url(#photoShadow)" transform="rotate(-6 60 60)">
    <!-- Back Polaroid Frame -->
    <rect x="26" y="24" width="60" height="74" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" transform="rotate(12 56 61)"/>
    <rect x="32" y="30" width="48" height="48" rx="2" fill="#38bdf8" transform="rotate(12 56 61)"/>

    <!-- Front Polaroid Frame -->
    <rect x="28" y="22" width="64" height="76" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Photo Picture Area -->
    <rect x="34" y="28" width="52" height="50" rx="3" fill="#0f172a"/>
    <!-- Photo Content (Couple silhouette / sunset) -->
    <path d="M 34 56 Q 50 48 60 54 Q 74 60 86 52 L 86 78 L 34 78 Z" fill="#ec4899"/>
    <circle cx="70" cy="42" r="6" fill="#facc15"/>
    <circle cx="50" cy="62" r="4" fill="#ffffff"/>
    <circle cx="60" cy="60" r="4" fill="#ffffff"/>

    <!-- Handwritten Heart on bottom white border -->
    <path d="M 60 87 C 60 85.5 58.5 84.5 57 84.5 C 55 84.5 54 86 54 87.5 C 54 90 58 92.5 60 94 C 62 92.5 66 90 66 87.5 C 66 86 65 84.5 63 84.5 C 61.5 84.5 60 85.5 60 87 Z" fill="#f43f5e"/>
  </g>
</svg>
