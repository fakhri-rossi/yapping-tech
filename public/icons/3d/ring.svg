<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="ringShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#b45309" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="48" fill="url(#ringGlow)"/>

  <g filter="url(#ringShadow)">
    <!-- Gold Ring Band (Elliptical 3D perspective) -->
    <ellipse cx="60" cy="72" rx="30" ry="20" fill="none" stroke="url(#goldBand)" stroke-width="9"/>
    <!-- Band Inner Hole for Depth -->
    <ellipse cx="60" cy="72" rx="21" ry="12" fill="none" stroke="#78350f" stroke-width="2" opacity="0.4"/>

    <!-- Ring Setting Claws -->
    <path d="M 50 54 L 54 44 L 66 44 L 70 54 Z" fill="url(#goldBand)"/>

    <!-- Brilliant Diamond -->
    <polygon points="60,26 78,40 42,40" fill="url(#diamondGrad)"/>
    <polygon points="42,40 78,40 60,54" fill="#38bdf8"/>
    <polygon points="52,40 68,40 60,54" fill="#bae6fd"/>
    <polygon points="54,26 66,26 68,40 52,40" fill="#ffffff"/>

    <!-- Diamond Glint / Star -->
    <path d="M 78 28 Q 80 32 84 34 Q 80 36 78 40 Q 76 36 72 34 Q 76 32 78 28 Z" fill="#ffffff"/>
  </g>
</svg>
