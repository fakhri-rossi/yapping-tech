<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="envGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="envBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <filter id="envShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#9f1239" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="48" fill="url(#envGlow)"/>

  <g filter="url(#envShadow)">
    <!-- Envelope Base Pocket -->
    <rect x="22" y="38" width="76" height="52" rx="12" fill="url(#envBody)"/>
    
    <!-- Envelope Interior / Letter peaking out -->
    <rect x="28" y="26" width="64" height="42" rx="6" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
    <line x1="36" y1="34" x2="64" y2="34" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="36" y1="41" x2="76" y2="41" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="36" y1="47" x2="70" y2="47" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom Envelope Flaps -->
    <path d="M 22 90 L 60 62 L 98 90 Z" fill="#fecdd3"/>
    <path d="M 22 38 L 60 64 L 22 90 Z" fill="#ffe4e6"/>
    <path d="M 98 38 L 60 64 L 98 90 Z" fill="#ffe4e6"/>

    <!-- Wax Seal Heart Center -->
    <circle cx="60" cy="62" r="10" fill="#e11d48"/>
    <path d="M 60 59 C 60 57.5 58.5 56.5 57 56.5 C 55 56.5 54 58 54 59.5 C 54 62 58 65 60 66.5 C 62 65 66 62 66 59.5 C 66 58 65 56.5 63 56.5 C 61.5 56.5 60 57.5 60 59 Z" fill="#ffffff"/>
  </g>
</svg>
