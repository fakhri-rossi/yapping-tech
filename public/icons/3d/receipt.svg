<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="receiptGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="receiptShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="48" fill="url(#receiptGlow)"/>

  <g filter="url(#receiptShadow)">
    <!-- Thermal Paper with Zig-Zag Cut Top and Bottom -->
    <path d="M 32 18 
             L 36 21 L 40 18 L 44 21 L 48 18 L 52 21 L 56 18 L 60 21 L 64 18 L 68 21 L 72 18 L 76 21 L 80 18 L 84 21 L 88 18 
             L 88 102 
             L 84 99 L 80 102 L 76 99 L 72 102 L 68 99 L 64 102 L 60 99 L 56 102 L 52 99 L 48 102 L 44 99 L 40 102 L 36 99 L 32 102 
             Z" fill="url(#paperGrad)"/>

    <!-- Receipt Header Bar -->
    <rect x="42" y="28" width="36" height="5" rx="2.5" fill="#10b981"/>
    
    <!-- Heart Icon in Receipt -->
    <path d="M 60 44 C 60 41 57 39 54 39 C 50.5 39 48 42 48 45.5 C 48 50 56 56 60 59 C 64 56 72 50 72 45.5 C 72 42 69.5 39 66 39 C 63 39 60 41 60 44 Z" fill="#ec4899"/>
    
    <!-- Receipt Item Lines -->
    <line x1="40" y1="64" x2="62" y2="64" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="72" y1="64" x2="80" y2="64" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    
    <line x1="40" y1="71" x2="58" y2="71" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="72" y1="71" x2="80" y2="71" stroke="#059669" stroke-width="2" stroke-linecap="round"/>

    <!-- Dashed Divider -->
    <line x1="38" y1="78" x2="82" y2="78" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Red "PAID IN LOVE" Stamp -->
    <g transform="rotate(-12 60 88)">
      <rect x="42" y="81" width="36" height="15" rx="4" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="2,1"/>
      <text x="60" y="92" text-anchor="middle" font-family="monospace" font-size="8" font-weight="900" fill="#e11d48" letter-spacing="1">PAID 100%</text>
    </g>
  </g>
</svg>
