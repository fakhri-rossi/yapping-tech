<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="camGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="metalChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e2e8f0"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="vintageShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#451a03" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="60" cy="62" r="48" fill="url(#camGlow2)"/>

  <g filter="url(#vintageShadow)">
    <!-- Lower Body Leather -->
    <rect x="20" y="44" width="80" height="48" rx="8" fill="url(#bodyLeather)"/>
    
    <!-- Top Chrome Metal Plate -->
    <rect x="20" y="30" width="80" height="16" rx="6" fill="url(#metalChrome)"/>

    <!-- Winder Dial -->
    <rect x="26" y="24" width="12" height="8" rx="2" fill="url(#metalChrome)"/>
    <!-- Shutter Button -->
    <rect x="78" y="24" width="10" height="8" rx="2" fill="url(#metalChrome)"/>
    <!-- Rangefinder Window -->
    <rect x="74" y="34" width="14" height="8" rx="2" fill="#1e293b"/>
    <circle cx="81" cy="38" r="2.5" fill="#38bdf8"/>

    <!-- Vintage Center Lens -->
    <circle cx="56" cy="64" r="22" fill="url(#metalChrome)"/>
    <circle cx="56" cy="64" r="18" fill="#1e293b"/>
    <circle cx="56" cy="64" r="14" fill="#0f172a"/>
    <circle cx="56" cy="64" r="10" fill="#0284c7" opacity="0.8"/>
    <ellipse cx="52" cy="60" rx="5" ry="3" transform="rotate(-30 52 60)" fill="#ffffff" opacity="0.7"/>

    <!-- Film Reel Badge -->
    <circle cx="84" cy="74" r="6" fill="#f59e0b"/>
    <circle cx="84" cy="74" r="2" fill="#1e293b"/>
  </g>
</svg>
