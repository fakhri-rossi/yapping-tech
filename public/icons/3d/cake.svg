<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="cakeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frostingTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <linearGradient id="cakeBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="cakeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#9f1239" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="60" cy="62" r="48" fill="url(#cakeGlow)"/>

  <g filter="url(#cakeShadow)">
    <!-- Bottom Plate -->
    <ellipse cx="60" cy="94" rx="42" ry="10" fill="#f1f5f9"/>
    <ellipse cx="60" cy="92" rx="38" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Bottom Cake Layer -->
    <path d="M 28 68 L 28 84 C 28 92 92 92 92 84 L 92 68 Z" fill="url(#cakeBase)"/>
    <!-- Bottom Layer Frosting -->
    <ellipse cx="60" cy="68" rx="32" ry="8" fill="url(#frostingTop)"/>

    <!-- Top Cake Layer -->
    <path d="M 38 48 L 38 60 C 38 66 82 66 82 60 L 82 48 Z" fill="#fda4af"/>
    <!-- Top Layer Frosting -->
    <ellipse cx="60" cy="48" rx="22" ry="6" fill="#ffffff"/>

    <!-- Candle -->
    <rect x="58" y="30" width="4" height="18" rx="2" fill="#38bdf8"/>
    <line x1="59" y1="34" x2="61" y2="34" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="59" y1="40" x2="61" y2="40" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Candle Flame -->
    <path d="M 60 20 Q 64 26 60 30 Q 56 26 60 20 Z" fill="#f59e0b"/>
    <circle cx="60" cy="26" r="2" fill="#fef08a"/>
    <circle cx="60" cy="24" r="6" fill="#fef08a" opacity="0.35"/>

    <!-- Cherries & Sprinkles -->
    <circle cx="44" cy="48" r="3" fill="#be123c"/>
    <circle cx="76" cy="48" r="3" fill="#be123c"/>
    <circle cx="36" cy="68" r="3.5" fill="#be123c"/>
    <circle cx="84" cy="68" r="3.5" fill="#be123c"/>
  </g>
</svg>
