<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="gradGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldTassel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="48" fill="url(#gradGlow)"/>

  <g filter="url(#capShadow)">
    <!-- Skull Cap Base -->
    <ellipse cx="60" cy="68" rx="26" ry="14" fill="#0f172a"/>
    <path d="M 34 68 Q 60 92 86 68 L 86 74 Q 60 98 34 74 Z" fill="url(#capGrad)"/>

    <!-- Diamond Mortarboard Top -->
    <polygon points="60,32 102,48 60,64 18,48" fill="url(#capGrad)"/>
    <!-- Rim highlight -->
    <polygon points="60,32 102,48 60,50 20,48" fill="#475569" opacity="0.4"/>

    <!-- Center Button -->
    <circle cx="60" cy="48" r="3.5" fill="#f59e0b"/>

    <!-- Gold Tassel Ribbon -->
    <path d="M 60 48 Q 78 52 82 66" fill="none" stroke="url(#goldTassel)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="82" cy="67" r="2" fill="#f59e0b"/>
    <!-- Tassel Brush -->
    <path d="M 80 68 L 84 68 L 86 84 L 78 84 Z" fill="url(#goldTassel)"/>
  </g>
</svg>
