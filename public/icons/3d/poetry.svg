<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="quillGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonFeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="60" cy="60" r="48" fill="url(#quillGlow)"/>

  <g filter="url(#neonShadow)" transform="rotate(-15 60 60)">
    <!-- Feather Quill Body -->
    <path d="M 68 20 C 80 32 84 56 62 82 L 58 84 L 59 74 C 54 78 48 84 46 92 L 44 94 L 46 82 C 40 76 42 54 58 32 C 62 26 66 22 68 20 Z" fill="url(#neonFeather)"/>
    
    <!-- Feather Stem / Shaft -->
    <path d="M 68 20 Q 56 60 40 102" fill="none" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
    <!-- Gold Nib -->
    <polygon points="40,102 34,108 44,106" fill="#f59e0b"/>

    <!-- Glowing Heart Particle at Tip -->
    <path d="M 32 108 C 32 106.5 30.5 105.5 29 105.5 C 27 105.5 26 107 26 108.5 C 26 111 30 114 32 115.5 C 34 114 38 111 38 108.5 C 38 107 37 105.5 35 105.5 C 33.5 105.5 32 106.5 32 108 Z" fill="#ec4899"/>
  </g>
</svg>
