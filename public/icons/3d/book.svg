<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bookGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="60" cy="62" r="48" fill="url(#bookGlow)"/>

  <g filter="url(#bookShadow)">
    <!-- Book Cover Spine & Back -->
    <path d="M 20 82 Q 60 92 60 92 Q 60 92 100 82 L 96 36 Q 60 46 60 46 Q 60 46 24 36 Z" fill="url(#bookCover)"/>

    <!-- Pages Thickness Layer -->
    <path d="M 22 80 Q 60 90 60 90 Q 60 90 98 80 L 98 75 Q 60 85 60 85 Q 60 85 22 75 Z" fill="#e2e8f0"/>

    <!-- Left Open Page -->
    <path d="M 24 38 Q 60 48 60 48 L 60 86 Q 24 76 24 76 Z" fill="#ffffff"/>
    <line x1="30" y1="48" x2="52" y2="54" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="56" x2="52" y2="62" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="64" x2="48" y2="68" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Open Page -->
    <path d="M 60 48 Q 96 38 96 38 L 96 76 Q 60 86 60 86 Z" fill="#f8fafc"/>
    <!-- Photo inside right page -->
    <rect x="68" y="46" width="20" height="20" rx="3" fill="#fecdd3" transform="rotate(-6 78 56)"/>
    <circle cx="78" cy="54" r="4" fill="#f43f5e"/>

    <!-- Gold Ribbon Bookmark -->
    <path d="M 60 46 L 60 94 L 64 90 L 68 94 L 68 47" fill="#f59e0b"/>
  </g>
</svg>
