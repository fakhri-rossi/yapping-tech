<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="lockGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldShackle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="maroonBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <filter id="lockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4c0519" flood-opacity="0.4"/>
    </filter>
  </defs>

  <circle cx="60" cy="62" r="48" fill="url(#lockGlow)"/>

  <g filter="url(#lockShadow)">
    <!-- Shackle Loop -->
    <path d="M 44 48 L 44 36 C 44 24 76 24 76 36 L 76 48" fill="none" stroke="url(#goldShackle)" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Lock Body -->
    <rect x="30" y="46" width="60" height="52" rx="14" fill="url(#maroonBody)"/>
    <rect x="32" y="48" width="56" height="4" rx="2" fill="#fda4af" opacity="0.3"/>

    <!-- Keyhole -->
    <circle cx="60" cy="68" r="6" fill="#fef08a"/>
    <path d="M 57 71 L 63 71 L 65 83 L 55 83 Z" fill="#fef08a"/>

    <!-- Sparkle Stars -->
    <path d="M 85 45 Q 86 48 89 49 Q 86 50 85 53 Q 84 50 81 49 Q 84 48 85 45 Z" fill="#fef08a"/>
  </g>
</svg>
