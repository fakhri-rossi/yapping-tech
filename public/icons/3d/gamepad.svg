<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="gameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="60%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <filter id="padShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4c1d95" flood-opacity="0.35"/>
    </filter>
  </defs>

  <circle cx="60" cy="62" r="48" fill="url(#gameGlow)"/>

  <g filter="url(#padShadow)">
    <!-- Gamepad Body -->
    <path d="M 32 46 C 20 46 16 66 22 84 C 26 94 36 94 44 84 L 52 74 L 68 74 L 76 84 C 84 94 94 94 98 84 C 104 66 100 46 88 46 C 76 46 68 54 60 54 C 52 54 44 46 32 46 Z" fill="url(#padGrad)"/>
    
    <!-- Top Edge Highlight -->
    <path d="M 34 48 C 44 48 52 56 60 56 C 68 56 76 48 86 48" fill="none" stroke="#ddd6fe" stroke-width="2" opacity="0.6"/>

    <!-- D-Pad (Left) -->
    <rect x="33" y="60" width="6" height="16" rx="2" fill="#1e1b4b"/>
    <rect x="28" y="65" width="16" height="6" rx="2" fill="#1e1b4b"/>

    <!-- Action Buttons (Right) -->
    <circle cx="84" cy="62" r="3.5" fill="#f43f5e"/>
    <circle cx="78" cy="68" r="3.5" fill="#38bdf8"/>
    <circle cx="90" cy="68" r="3.5" fill="#34d399"/>
    <circle cx="84" cy="74" r="3.5" fill="#facc15"/>

    <!-- Center Heart Brand -->
    <path d="M 60 66 C 60 64 58.5 63 57 63 C 55 63 54 64.5 54 66 C 54 68 58 71 60 72 C 62 71 66 68 66 66 C 66 64.5 65 63 63 63 C 61.5 63 60 64 60 66 Z" fill="#fda4af"/>
  </g>
</svg>
